<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANEXOS</title>
    <link rel="stylesheet" href="styte2.css">
    <link href="https://fonts.cdnfonts.com/css/texturina" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/expletus-sans-2" rel="stylesheet">
</head>

<body>
    <script>
        if (sessionStorage.getItem("logado") !== "true") {
            window.location.href = "login.html";
        }
    </script>
    <header>
        <div class="logo">Anexos</div>
        <nav>
            <ul>
                <li><a href="index.html#inicio">Início</a></li>
                <li><a href="index.html">Atividades</a></li>
                <li><a href="index.html#ppe">PPE</a></li>
                <li><a href="index.html#curriculo">Currículo</a></li>
                <li><a href="index.html#contatos">Contatos</a></li>
            </ul>
        </nav>
    </header>
    <div class="atividades">
        <div class="carousel">
            <button class="carousel-btn carousel-btn-left" id="prevBtn"> < </button>
            <div class="carousel-content">
                <h3 id="carouselTitle">PROJETO CONEXÃO INDÚSTRIA - JUNHO/2026</h3>
                <img class="anexo" id="carouselImg" src="./img/Anexos (1).png">
            </div>
            <button class="carousel-btn carousel-btn-right" id="nextBtn"> > </button>
        </div>
        <div class="carousel-dots" id="carouselDots"></div>
    </div>

    <style>
        .carousel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: -10px;
            padding: 20px;
        }

        .carousel-content {
            text-align: center;
            max-width: 750px;
        }

        .carousel-content h3 {
            font-size: 22px;
            margin-bottom: 20px;
            color: var(--orange);
            text-shadow: 1px 1px 0px var(--red);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-content img {
            width: 700px;
            max-width: 90vw;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: opacity 0.4s ease;
        }

        .carousel-btn {
            background-color: var(--dark);
            color: var(--orange);
            border: 2px solid var(--orange);
            font-size: 24px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .carousel-btn:hover {
            background-color: var(--orange);
            color: var(--dark);
        }

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .carousel-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--dark);
            border: 2px solid var(--orange);
            cursor: pointer;
            transition: 0.3s;
        }

        .carousel-dot.active {
            background-color: var(--orange);
            transform: scale(1.2);
        }
    </style>

    <script>
        const slides = [
            { img: "./img/Anexos (1).png", title: "PROJETO CONEXÃO INDÚSTRIA - JUNHO/2026" },
            { img: "./img/Anexos.png", title: "GRAND PRIX SENAI - AGOSTO/2026" }
        ];

        let current = 0;
        const carouselImg = document.getElementById("carouselImg");
        const carouselTitle = document.getElementById("carouselTitle");
        const dotsContainer = document.getElementById("carouselDots");

        slides.forEach((_, i) => {
            const dot = document.createElement("span");
            dot.classList.add("carousel-dot");
            if (i === 0) dot.classList.add("active");
            dot.addEventListener("click", () => goTo(i));
            dotsContainer.appendChild(dot);
        });

        function goTo(index) {
            current = index;
            carouselImg.style.opacity = 0;
            setTimeout(() => {
                carouselImg.src = slides[current].img;
                carouselTitle.textContent = slides[current].title;
                carouselImg.style.opacity = 1;
            }, 300);
            document.querySelectorAll(".carousel-dot").forEach((d, i) => {
                d.classList.toggle("active", i === current);
            });
        }

        document.getElementById("prevBtn").addEventListener("click", () => {
            goTo(current === 0 ? slides.length - 1 : current - 1);
        });

        document.getElementById("nextBtn").addEventListener("click", () => {
            goTo(current === slides.length - 1 ? 0 : current + 1);
        });

        setInterval(() => {
            goTo(current === slides.length - 1 ? 0 : current + 1);
        }, 5000);
    </script>
</body>

</html>

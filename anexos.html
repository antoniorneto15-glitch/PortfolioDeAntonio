<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANEXOS</title>
    <link rel="stylesheet" href="styte2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <script>
        if (sessionStorage.getItem("logado") !== "true") {
            window.location.href = "login.html";
        }
    </script>
    <header>
        <div class="logo">Anexos</div>
        <nav>
            <ul>
                <li><a href="index.html#inicio">Início</a></li>
                <li><a href="atividades.html">Atividades</a></li>
                <li><a href="index.html#ppe">PPE</a></li>
                <li><a href="index.html#contatos">Contatos</a></li>
            </ul>
        </nav>
    </header>
    <div class="atividades">
        <div class="carousel">
            <button class="carousel-btn carousel-btn-left" id="prevBtn" aria-label="Slide anterior"> < </button>
            <div class="carousel-content">
                <h3 id="carouselTitle">PROJETO CONEXÃO INDÚSTRIA - JUNHO/2026</h3>
                <img class="anexo" id="carouselImg" src="./img/Anexos (1).png" alt="Projeto Conexão Indústria - Junho de 2026">
            </div>
            <button class="carousel-btn carousel-btn-right" id="nextBtn" aria-label="Próximo slide"> > </button>
        </div>
        <div class="carousel-dots" id="carouselDots"></div>
    </div>
    <script>
        const slides = [
            { img: "./img/Anexos (1).png", title: "PROJETO CONEXÃO INDÚSTRIA - JUNHO/2026" },
            { img: "./img/Anexos.png", title: "GRAND PRIX SENAI - AGOSTO/2026" }
        ];

        let current = 0;
        const carouselImg = document.getElementById("carouselImg");
        const carouselTitle = document.getElementById("carouselTitle");
        const dotsContainer = document.getElementById("carouselDots");

        slides.forEach((_, i) => {
            const dot = document.createElement("button");
            dot.type = "button";
            dot.classList.add("carousel-dot");
            dot.setAttribute("aria-label", `Ir para o slide ${i + 1}`);
            if (i === 0) {
                dot.classList.add("active");
                dot.setAttribute("aria-current", "true");
            }
            dot.addEventListener("click", () => goTo(i));
            dotsContainer.appendChild(dot);
        });

        function goTo(index) {
            current = index;
            carouselImg.style.opacity = 0;
            setTimeout(() => {
                carouselImg.src = slides[current].img;
                carouselImg.alt = slides[current].title;
                carouselTitle.textContent = slides[current].title;
                carouselImg.style.opacity = 1;
            }, 300);
            document.querySelectorAll(".carousel-dot").forEach((d, i) => {
                d.classList.toggle("active", i === current);
                if (i === current) {
                    d.setAttribute("aria-current", "true");
                } else {
                    d.removeAttribute("aria-current");
                }
            });
        }

        document.getElementById("prevBtn").addEventListener("click", () => {
            goTo(current === 0 ? slides.length - 1 : current - 1);
        });

        document.getElementById("nextBtn").addEventListener("click", () => {
            goTo(current === slides.length - 1 ? 0 : current + 1);
        });

        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const carousel = document.querySelector(".carousel");
        let autoplay = null;

        function startAutoplay() {
            if (reduceMotion || autoplay) return;
            autoplay = setInterval(() => {
                goTo(current === slides.length - 1 ? 0 : current + 1);
            }, 5000);
        }

        function stopAutoplay() {
            clearInterval(autoplay);
            autoplay = null;
        }

        carousel.addEventListener("mouseenter", stopAutoplay);
        carousel.addEventListener("mouseleave", startAutoplay);
        carousel.addEventListener("focusin", stopAutoplay);
        carousel.addEventListener("focusout", startAutoplay);
        startAutoplay();
    </script>
    <script src="cursor.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Antonio Rodrigues</title>
    <link rel="stylesheet" href="style-login.css">
    <link href="https://fonts.cdnfonts.com/css/texturina" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/expletus-sans-2" rel="stylesheet">
</head>

<body>

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">Antonio Rodrigues</div>
            <p class="login-subtitle">Logue para acessar o Portfólio</p>

            <form id="loginForm">
                <div class="field">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" placeholder="Seu usuário" autocomplete="off">
                </div>

                <div class="field">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Sua senha">
                    <span class="show-password" id="toggleSenha">Mostrar</span>
                </div>

                <p id="errorMsg" class="error-msg" style="display:none;">Email ou senha incorretos.</p>

                <button type="submit" class="btn-login">Entrar</button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById("loginForm");
        const senhaInput = document.getElementById("senha");
        const errorMsg = document.getElementById("errorMsg");

        const usuarios = [
            { usuario: "Antonio", senha: "antneto@2" },
            { usuario: "Admin", senha: "adm1234" },
            { usuario: "Professor", senha: "prof2026" }
        ];

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const usuario = document.getElementById("usuario").value.trim();
            const senha = senhaInput.value;

            errorMsg.style.display = "none";

            const encontrado = usuarios.find(u => u.usuario === usuario && u.senha === senha);

            if (encontrado) {
                sessionStorage.setItem("logado", "true");
                window.location.href = "index.html";
            } else {
                errorMsg.textContent = "Usuário ou senha incorretos.";
                errorMsg.style.display = "block";
            }
        });

        const toggleSenha = document.getElementById("toggleSenha");
        toggleSenha.addEventListener("click", function () {
            const type = senhaInput.type === "password" ? "text" : "password";
            senhaInput.type = type;
            toggleSenha.textContent = type === "password" ? "Mostrar" : "Ocultar";
        });
    </script>

</body>

</html>
